version: '3.8'

services:
  altar-extractor:
    build: .
    image: altar-extractor:latest
    container_name: altar-extractor
    ports:
      - "8050:8050"
    env_file:
      - .env
    environment:
      - PORT=8050
      - DEBUG=false
      - GUNICORN_WORKERS=4  # Adjust: 2 * CPU cores + 1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8050/"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Pour se connecter à un réseau Docker existant (ex: celui de MongoDB)
    # Décommentez et adaptez le nom du réseau :
    # networks:
    #   - altar_default
    # 
    # Et ajoutez à la fin du fichier :
    # networks:
    #   altar_default:
    #     external: true

